name: Build & Push Unstract Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: unstract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup disk
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate registry env
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_URL }}
        run: |
          set -euo pipefail
          echo "REGISTRY_HOST=${REGISTRY_HOST}"
          test -n "${REGISTRY_HOST}" || (echo "ERROR: REGISTRY_HOST empty" && exit 1)
          if echo "${REGISTRY_HOST}" | grep -qE 'https?://|/'; then
            echo "ERROR: REGISTRY_HOST must be host only (no scheme, no slashes)"
            exit 1
          fi

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push all images (compose)
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_URL }}
          VERSION: latest
        run: |
          set -euo pipefail
          cd docker
          docker compose -f docker-compose.build.yaml build --push
