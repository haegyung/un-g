services:
  frontend:
    image: ${REGISTRY_HOST}/unstract/frontend:${VERSION}
    build:
      dockerfile: docker/dockerfiles/frontend.Dockerfile
      context: ..
      target: production

  backend:
    image: ${REGISTRY_HOST}/unstract/backend:${VERSION}
    build:
      dockerfile: docker/dockerfiles/backend.Dockerfile
      context: ..

  runner:
    image: ${REGISTRY_HOST}/unstract/runner:${VERSION}
    build:
      dockerfile: docker/dockerfiles/runner.Dockerfile
      context: ..

  tool-sidecar:
    image: ${REGISTRY_HOST}/unstract/tool-sidecar:${VERSION}
    build:
      dockerfile: docker/dockerfiles/tool-sidecar.Dockerfile
      context: ..

  tool-structure:
    image: ${REGISTRY_HOST}/unstract/tool-structure:${VERSION}
    build:
      dockerfile: tools/structure/Dockerfile
      context: ..

  tool-text_extractor:
    image: ${REGISTRY_HOST}/unstract/tool-text_extractor:${VERSION}
    build:
      dockerfile: tools/text_extractor/Dockerfile
      context: ..

  tool-classifier:
    image: ${REGISTRY_HOST}/unstract/tool-classifier:${VERSION}
    build:
      dockerfile: tools/classifier/Dockerfile
      context: ..

  platform-service:
    image: ${REGISTRY_HOST}/unstract/platform-service:${VERSION}
    build:
      dockerfile: docker/dockerfiles/platform.Dockerfile
      context: ..

  prompt-service:
    image: ${REGISTRY_HOST}/unstract/prompt-service:${VERSION}
    build:
      dockerfile: docker/dockerfiles/prompt.Dockerfile
      context: ..

  x2text-service:
    image: ${REGISTRY_HOST}/unstract/x2text-service:${VERSION}
    build:
      dockerfile: docker/dockerfiles/x2text.Dockerfile
      context: ..

  worker-unified:
    image: ${REGISTRY_HOST}/unstract/worker-unified:${VERSION}
    build:
      dockerfile: docker/dockerfiles/worker-unified.Dockerfile
      context: ..
      args:
        MINIMAL_BUILD: ${MINIMAL_BUILD:-0}
